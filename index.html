<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xenon Airdrop Ultimate | With Website Link</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0a2a, #030318);
            min-height: 100vh;
            padding: 20px;
            transition: all 0.3s;
        }
        body.light { background: radial-gradient(circle at 20% 30%, #f0f4ff, #e0e8ff); }
        .container { max-width: 1400px; margin: 0 auto; }
        .glass {
            background: rgba(15,15,35,0.55);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        body.light .glass { background: rgba(255,255,255,0.7); border-color: rgba(100,80,200,0.2); }
        .header { padding: 20px 28px; margin-bottom: 24px; display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; gap: 20px; }
        .logo h1 { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg,#FFD700,#FF8C00,#FFD700); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 3s linear infinite; }
        @keyframes shine { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        .logo p { font-size: 0.7rem; color: rgba(255,255,255,0.5); }
        .stats-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat-card { background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); padding: 10px 20px; border-radius: 28px; text-align: center; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-number { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg,#FFD700,#FFA500); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stat-label { font-size: 0.65rem; color: rgba(255,255,255,0.6); }
        .progress-ring { position: relative; width: 65px; height: 65px; }
        .progress-ring svg { transform: rotate(-90deg); }
        .progress-ring circle { fill: none; stroke-width: 6; }
        .progress-ring .bg { stroke: rgba(255,255,255,0.2); }
        .progress-ring .fill { stroke: #FFD700; stroke-dasharray: 188.5; stroke-dashoffset: 188.5; transition: 0.5s; }
        .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 0.7rem; font-weight: bold; color: #FFD700; }
        .theme-toggle { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 40px; cursor: pointer; }
        .progress-section { padding: 18px 25px; margin-bottom: 24px; }
        .progress-label { display: flex; justify-content: space-between; margin-bottom: 10px; color: #FFD700; font-size: 0.8rem; }
        .progress-bar-container { background: rgba(255,255,255,0.15); border-radius: 30px; height: 10px; overflow: hidden; }
        .progress-bar-fill { background: linear-gradient(90deg,#FFD700,#FF8C00); width: 0%; height: 100%; border-radius: 30px; transition: width 0.5s; position: relative; overflow: hidden; }
        .progress-bar-fill::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .form-section { padding: 22px; margin-bottom: 24px; }
        .form-title { font-size: 1.1rem; margin-bottom: 16px; color: #FFD700; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .form-grid input, .form-grid select, .form-grid textarea { background: rgba(255,255,255,0.95); border: none; padding: 10px 14px; border-radius: 20px; font-family: inherit; font-size: 0.85rem; }
        .form-grid input:focus { outline: none; box-shadow: 0 0 0 3px rgba(255,215,0,0.3); }
        .btn-add { background: linear-gradient(135deg,#FFD700,#FF8C00); border: none; padding: 10px 24px; border-radius: 40px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-add:hover { transform: scale(1.02); box-shadow: 0 4px 15px rgba(255,215,0,0.4); }
        .controls { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
        .search-box { flex: 1; background: rgba(255,255,255,0.95); border: none; padding: 10px 18px; border-radius: 40px; }
        .filter-group, .action-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-chip, .action-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 40px; cursor: pointer; font-size: 0.75rem; transition: 0.2s; color: white; }
        body.light .filter-chip, body.light .action-btn { color: #333; background: rgba(0,0,0,0.05); }
        .filter-chip.active { background: linear-gradient(135deg,#FFD700,#FF8C00); color: #1a1a2e; }
        .task-container { overflow-x: auto; margin-bottom: 24px; }
        .task-table { width: 100%; border-collapse: collapse; min-width: 700px; }
        .task-table th { text-align: left; padding: 12px 10px; background: rgba(0,0,0,0.3); color: #FFD700; font-size: 0.75rem; }
        .task-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); color: rgba(255,255,255,0.9); font-size: 0.8rem; }
        .task-table tr:hover { background: rgba(255,255,255,0.05); }
        .category-badge { background: rgba(255,215,0,0.15); padding: 3px 10px; border-radius: 30px; font-size: 0.65rem; display: inline-block; }
        .status-badge { background: rgba(255,215,0,0.2); padding: 4px 12px; border-radius: 30px; font-size: 0.65rem; cursor: pointer; display: inline-block; }
        .status-badge.done { background: #6bcb77; color: #1a1a2e; }
        .task-actions { display: flex; gap: 5px; }
        .task-btn { background: rgba(255,255,255,0.1); border: none; padding: 4px 10px; border-radius: 20px; cursor: pointer; }
        .task-btn.edit { color: #FFD700; }
        .task-btn.delete { color: #ff6b6b; }
        .website-link { background: rgba(100,200,255,0.2); padding: 4px 8px; border-radius: 20px; font-size: 0.7rem; text-decoration: none; color: #88ccff; display: inline-block; word-break: break-all; max-width: 180px; }
        .website-link:hover { background: rgba(100,200,255,0.4); }
        .footer { text-align: center; padding: 20px; margin-top: 20px; color: rgba(255,255,255,0.4); font-size: 0.7rem; }
        .footer a { color: #FFD700; text-decoration: none; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.9); backdrop-filter: blur(12px); padding: 10px 20px; border-radius: 40px; color: white; z-index: 1000; animation: slideIn 0.3s ease; border-left: 4px solid #FFD700; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 768px) { body { padding: 12px; } .stat-number { font-size: 1.2rem; } .logo h1 { font-size: 1rem; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header glass">
        <div class="logo"><h1>⚡ XENON AIRDROP ULTIMATE</h1><p>task tracker • with project website</p></div>
        <div class="stats-row">
            <div class="progress-ring"><svg width="65" height="65"><circle class="bg" cx="32.5" cy="32.5" r="28" stroke="rgba(255,255,255,0.2)" stroke-width="5" fill="none"/><circle class="fill" id="progressCircle" cx="32.5" cy="32.5" r="28" stroke="#FFD700" stroke-width="5" fill="none" stroke-dasharray="175.9" stroke-dashoffset="175.9"/></svg><div class="progress-text" id="progressPercent">0%</div></div>
            <div class="stat-card"><div class="stat-number" id="totalCount">0</div><div class="stat-label">Total</div></div>
            <div class="stat-card"><div class="stat-number" id="completedCount">0</div><div class="stat-label">Done</div></div>
            <div class="stat-card"><div class="stat-number" id="pendingCount">0</div><div class="stat-label">Pending</div></div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </div>
    <div class="progress-section glass"><div class="progress-label"><span>📊 Overall Progress</span><span id="progressLabel">0%</span></div><div class="progress-bar-container"><div class="progress-bar-fill" id="progressBarFill"></div></div></div>
    <div class="form-section glass">
        <div class="form-title">➕ Add New Task + Website Link</div>
        <div class="form-grid">
            <input type="text" id="taskName" placeholder="Project name *">
            <select id="taskCategory"><option value="DeFi">📊 DeFi</option><option value="NFT">🎨 NFT</option><option value="L1">⛓️ L1</option><option value="L2">⚡ L2</option><option value="GameFi">🎮 GameFi</option><option value="Social">💬 SocialFi</option></select>
            <select id="taskPriority"><option value="High">🔥 High</option><option value="Mid">⚡ Mid</option><option value="Low">💤 Low</option></select>
            <input type="date" id="taskDate">
            <input type="url" id="taskWebsite" placeholder="🔗 Project website (https://...)" style="grid-column: span 1;">
            <textarea id="taskDesc" placeholder="Notes / links..." rows="2" style="grid-column: span 2;"></textarea>
        </div>
        <button class="btn-add" onclick="addTask()">+ Create Task with Website</button>
    </div>
    <div class="controls">
        <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search...">
        <div class="filter-group"><button class="filter-chip active" data-filter="all" onclick="setFilter('all')">All</button><button class="filter-chip" data-filter="DeFi" onclick="setFilter('DeFi')">DeFi</button><button class="filter-chip" data-filter="NFT" onclick="setFilter('NFT')">NFT</button><button class="filter-chip" data-filter="L1" onclick="setFilter('L1')">L1</button><button class="filter-chip" data-filter="L2" onclick="setFilter('L2')">L2</button><button class="filter-chip" data-filter="GameFi" onclick="setFilter('GameFi')">GameFi</button><button class="filter-chip" data-filter="Social" onclick="setFilter('Social')">Social</button></div>
        <div class="action-group"><button class="action-btn" onclick="exportCSV()">📊 CSV</button><button class="action-btn" onclick="exportData()">📤 JSON</button><button class="action-btn" onclick="importData()">📥 Import</button></div>
    </div>
    <div class="task-container glass">
        <table class="task-table">
            <thead><tr><th>Project</th><th>Category</th><th>Priority</th><th>Deadline</th><th>Website</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="taskList"><tr><td colspan="7" style="text-align:center;">✨ No tasks yet</td></tr></tbody>
        </table>
    </div>
    <div class="footer">⚡ Xenon Airdrop Ultimate | Simpan link website project airdrop kamu! | <a href="https://sociabuzz.com/xenonsixtytwo/tribe" target="_blank">❤️ Donate</a></div>
</div>
<script>
    let tasks = [], currentFilter = 'all', searchQuery = '';
    function showToast(msg, isErr = false) { let t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; if(isErr) t.style.borderLeftColor = '#ff6b6b'; document.body.appendChild(t); setTimeout(() => t.remove(), 2500); }
    function loadTasks() { let saved = localStorage.getItem('xenon_ultimate_with_website'); if(saved) tasks = JSON.parse(saved); else tasks = [ { id: 1, name: "zkSync Era", category: "L2", priority: "High", desc: "Bridge + swap", deadline: new Date().toISOString().slice(0,10), website: "https://zksync.io", status: "pending" }, { id: 2, name: "LayerZero", category: "L2", priority: "High", desc: "Cross-chain", deadline: new Date(Date.now()+7*86400000).toISOString().slice(0,10), website: "https://layerzero.network", status: "pending" }, { id: 3, name: "Scroll", category: "L2", priority: "Mid", desc: "Testnet", deadline: new Date(Date.now()-1*86400000).toISOString().slice(0,10), website: "https://scroll.io", status: "done" } ]; renderAll(); }
    function saveTasks() { localStorage.setItem('xenon_ultimate_with_website', JSON.stringify(tasks)); }
    function addTask() { let name = document.getElementById('taskName').value.trim(); if(!name) { showToast('❌ Name required!', true); return; } let website = document.getElementById('taskWebsite').value.trim(); if(website && !website.startsWith('http')) website = 'https://' + website; let newTask = { id: Date.now(), name: name, category: document.getElementById('taskCategory').value, priority: document.getElementById('taskPriority').value, desc: document.getElementById('taskDesc').value.trim(), deadline: document.getElementById('taskDate').value, website: website, status: 'pending' }; tasks.unshift(newTask); saveTasks(); document.getElementById('taskName').value = ''; document.getElementById('taskDesc').value = ''; document.getElementById('taskDate').value = ''; document.getElementById('taskWebsite').value = ''; renderAll(); showToast('✅ Task added!'); }
    function deleteTask(id) { if(confirm('Delete task?')) { tasks = tasks.filter(t => t.id !== id); saveTasks(); renderAll(); showToast('🗑️ Deleted'); } }
    function toggleStatus(id) { tasks = tasks.map(t => { if(t.id===id) t.status = t.status==='pending'?'done':'pending'; return t; }); saveTasks(); renderAll(); showToast(tasks.find(t=>t.id===id)?.status==='done'?'✅ Completed!':'🔄 Reopened'); }
    function editTask(id) { let task = tasks.find(t=>t.id===id); if(!task) return; let newName = prompt('Edit name:', task.name); if(newName?.trim()) task.name = newName.trim(); let newDesc = prompt('Edit notes:', task.desc); if(newDesc !== null) task.desc = newDesc; let newDeadline = prompt('Edit deadline (YYYY-MM-DD):', task.deadline); if(newDeadline) task.deadline = newDeadline; let newWebsite = prompt('Edit website URL:', task.website); if(newWebsite !== null) task.website = newWebsite; saveTasks(); renderAll(); showToast('✏️ Updated'); }
    function getPriorityClass(p) { return p==='High'?'priority-high':(p==='Mid'?'priority-mid':'priority-low'); }
    function renderTasks() { let filtered = tasks.filter(t => { if(currentFilter!=='all' && t.category!==currentFilter) return false; if(searchQuery && !t.name.toLowerCase().includes(searchQuery) && !t.desc.toLowerCase().includes(searchQuery)) return false; return true; }); let tbody = document.getElementById('taskList'); if(filtered.length===0) { tbody.innerHTML='<tr><td colspan="7" style="text-align:center;">✨ No tasks found</td></tr>'; return; } tbody.innerHTML = filtered.map(task => ` <tr> <td><strong>${escapeHtml(task.name)}</strong><br><small style="opacity:0.7">${escapeHtml(task.desc?.substring(0,40)||'')}</small></td> <td><span class="category-badge">${task.category}</span></td> <td class="${getPriorityClass(task.priority)}">${task.priority}</td> <td>${task.deadline || '-'}</td> <td>${task.website ? `<a href="${task.website}" target="_blank" class="website-link">🔗 Visit</a>` : '-'}</td> <td><span class="status-badge ${task.status==='done'?'done':''}" onclick="toggleStatus(${task.id})">${task.status==='done'?'✅ Done':'⏳ Pending'}</span></td> <td class="task-actions"><button class="task-btn edit" onclick="editTask(${task.id})">✏️</button><button class="task-btn delete" onclick="deleteTask(${task.id})">🗑️</button></td> </tr> `).join(''); }
    function updateProgress() { let total = tasks.length, done = tasks.filter(t=>t.status==='done').length; let percent = total===0?0:(done/total)*100; document.getElementById('totalCount').textContent = total; document.getElementById('completedCount').textContent = done; document.getElementById('pendingCount').textContent = total-done; document.getElementById('progressLabel').textContent = `${Math.round(percent)}% Complete`; document.getElementById('progressBarFill').style.width = `${percent}%`; document.getElementById('progressPercent').textContent = `${Math.round(percent)}%`; let circ = 175.9, offset = circ - (percent/100)*circ; document.getElementById('progressCircle')?.setAttribute('stroke-dashoffset', offset); }
    function setFilter(cat) { currentFilter = cat; document.querySelectorAll('.filter-chip').forEach(c => { if(c.dataset.filter === cat) c.classList.add('active'); else c.classList.remove('active'); }); renderTasks(); }
    document.getElementById('searchInput')?.addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase(); renderTasks(); });
    function exportCSV() { let csv = "ID,Name,Category,Priority,Description,Deadline,Website,Status\n"; tasks.forEach(t => { csv += `"${t.id}","${t.name}","${t.category}","${t.priority}","${t.desc}","${t.deadline}","${t.website || ''}","${t.status}"\n`; }); let blob = new Blob([csv], {type: 'text/csv'}); let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `xenon-airdrop-${new Date().toISOString().slice(0,10)}.csv`; a.click(); URL.revokeObjectURL(a.href); showToast('📊 CSV exported'); }
    function exportData() { let data = JSON.stringify(tasks, null, 2); let blob = new Blob([data], {type: 'application/json'}); let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `xenon-airdrop-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(a.href); showToast('📤 JSON exported'); }
    function importData() { let input = document.createElement('input'); input.type = 'file'; input.accept = 'application/json'; input.onchange = e => { let file = e.target.files[0]; let reader = new FileReader(); reader.onload = ev => { try { let imported = JSON.parse(ev.target.result); if(Array.isArray(imported)) { tasks = imported; saveTasks(); renderAll(); showToast('📥 Imported!'); } else throw new Error(); } catch { showToast('❌ Invalid file', true); } }; reader.readAsText(file); }; input.click(); }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]||m)); }
    function renderAll() { renderTasks(); updateProgress(); }
    function toggleTheme() { document.body.classList.toggle('light'); let btn = document.querySelector('.theme-toggle'); btn.textContent = document.body.classList.contains('light') ? '☀️' : '🌙'; }
    loadTasks();
</script>
</body>
</html>
