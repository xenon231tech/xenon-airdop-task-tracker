<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="XENON ULTIMATE - Airdrop Tracker Profesional untuk Hunter Crypto">
    <title>XENON ULTIMATE • Airdrop Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        
        :root {
            --neon: #00f7ff;
        }
        
        body {
            background: radial-gradient(circle at top left, #0a0a0a 0%, #111111 100%);
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .title-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        .header-glow {
            text-shadow: 0 0 30px rgba(0, 247, 255, 0.6);
        }

        .card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(0, 247, 255, 0.15);
        }
        
        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 247, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgb(0 247 255 / 0.15);
        }

        .neon-button {
            background: linear-gradient(90deg, #00f7ff, #a855f7);
            box-shadow: 0 0 20px rgba(0, 247, 255, 0.5);
        }
        
        .task-done {
            text-decoration: line-through;
            opacity: 0.5;
        }
        
        .modal {
            animation: modalPop 0.3s ease forwards;
        }
        
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen text-white">
    <!-- Navbar -->
    <nav class="border-b border-white/10 bg-black/70 backdrop-blur-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-8 py-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-gradient-to-br from-cyan-400 to-purple-600 rounded-2xl flex items-center justify-center text-2xl shadow-inner">
                    ⚡
                </div>
                <div>
                    <h1 class="title-font text-3xl tracking-tighter header-glow">XENON ULTIMATE</h1>
                </div>
            </div>
            <div class="flex items-center gap-8 text-sm font-medium">
                <a href="#" onclick="exportData()" class="flex items-center gap-2 hover:text-cyan-400 transition">
                    <i class="fas fa-download"></i>
                    <span>Export</span>
                </a>
                <a href="#" onclick="importData()" class="flex items-center gap-2 hover:text-cyan-400 transition">
                    <i class="fas fa-upload"></i>
                    <span>Import</span>
                </a>
                <button onclick="clearAllData()" 
                        class="text-red-400 hover:text-red-500 flex items-center gap-2 transition">
                    <i class="fas fa-trash"></i>
                    <span>Reset</span>
                </button>
                <div class="w-8 h-8 bg-white/10 rounded-2xl flex items-center justify-center text-xl cursor-pointer" onclick="window.location.reload()">
                    👽
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-8 py-10">
        <!-- Hero Header -->
        <div class="flex justify-between items-end mb-12">
            <div>
                <div class="inline-flex items-center gap-2 bg-white/5 text-cyan-400 text-sm font-medium px-5 py-2 rounded-3xl mb-4 border border-white/10">
                    <div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></div>
                    LIVE AIRDROP HUNTER
                </div>
                <h1 class="title-font text-6xl font-semibold tracking-tighter header-glow leading-none">
                    Airdrop Tracker
                </h1>
                <p class="text-2xl text-white/70 mt-3">Kelola semua tugas airdrop kamu dengan profesional</p>
            </div>
            
            <button onclick="showAddModal()" 
                    class="neon-button text-black font-semibold px-8 py-5 rounded-3xl flex items-center gap-3 text-lg hover:scale-105 transition">
                <i class="fas fa-plus"></i>
                TAMBAH AIRDROP BARU
            </button>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
            <div class="bg-gradient-to-br from-zinc-900 to-black border border-white/10 rounded-3xl p-6 card">
                <p class="text-white/60 text-sm">Total Project</p>
                <p id="total-airdrop" class="text-5xl font-semibold mt-2 text-white">0</p>
            </div>
            <div class="bg-gradient-to-br from-zinc-900 to-black border border-white/10 rounded-3xl p-6 card">
                <p class="text-white/60 text-sm">Sudah Claimed</p>
                <p id="completed-airdrop" class="text-5xl font-semibold mt-2 text-emerald-400">0</p>
            </div>
            <div class="bg-gradient-to-br from-zinc-900 to-black border border-white/10 rounded-3xl p-6 card">
                <p class="text-white/60 text-sm">Total Tugas</p>
                <p id="total-tasks" class="text-5xl font-semibold mt-2 text-amber-400">0</p>
            </div>
            <div class="bg-gradient-to-br from-zinc-900 to-black border border-white/10 rounded-3xl p-6 card relative overflow-hidden">
                <p class="text-white/60 text-sm">Progress Keseluruhan</p>
                <p id="overall-progress" class="text-5xl font-semibold mt-2 text-cyan-400">0%</p>
                <div class="absolute bottom-0 right-0 text-[120px] font-black text-cyan-400/10 leading-none">%</div>
            </div>
        </div>

        <!-- Search & Filter -->
        <div class="flex gap-4 mb-8">
            <div class="flex-1 relative">
                <input type="text" id="search-input" 
                       onkeyup="filterAirdrops()"
                       placeholder="Cari project atau tugas airdrop..." 
                       class="w-full bg-white/5 border border-white/10 rounded-3xl px-7 py-5 pl-14 focus:outline-none focus:border-cyan-400 text-lg">
                <i class="fas fa-search absolute left-7 top-1/2 -translate-y-1/2 text-white/40 text-xl"></i>
            </div>
            <select id="status-filter" onchange="filterAirdrops()" 
                    class="bg-white/5 border border-white/10 rounded-3xl px-7 text-lg focus:outline-none focus:border-cyan-400">
                <option value="">Semua Status</option>
                <option value="Ongoing">Ongoing</option>
                <option value="Claimed">Claimed</option>
                <option value="Ended">Ended</option>
            </select>
        </div>

        <!-- Airdrop Grid -->
        <div id="airdrop-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards di-generate oleh JavaScript -->
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl flex items-center justify-center z-50">
        <div class="modal bg-zinc-900 w-full max-w-lg mx-4 rounded-3xl border border-white/10 shadow-2xl">
            <div class="px-8 pt-8 pb-6">
                <h2 id="modal-title" class="text-3xl font-semibold title-font">Tambah Project Baru</h2>
                
                <div class="mt-8 space-y-6">
                    <div>
                        <label class="block text-white/60 text-sm mb-2">Nama Project / Airdrop</label>
                        <input id="project-name" type="text" 
                               class="w-full bg-white/5 border border-white/10 focus:border-cyan-400 rounded-3xl px-6 py-5 text-lg outline-none" 
                               placeholder="LayerZero, ZKsync, dll">
                    </div>
                    
                    <div>
                        <label class="block text-white/60 text-sm mb-2">Link Project</label>
                        <input id="project-link" type="text" 
                               class="w-full bg-white/5 border border-white/10 focus:border-cyan-400 rounded-3xl px-6 py-5 text-lg outline-none" 
                               placeholder="https://app.layerzero.network">
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-white/60 text-sm mb-2">Platform</label>
                            <select id="project-platform" class="w-full bg-white/5 border border-white/10 focus:border-cyan-400 rounded-3xl px-6 py-5 text-lg outline-none">
                                <option value="Multi">Multi-Chain</option>
                                <option value="Twitter">Twitter / X</option>
                                <option value="Discord">Discord</option>
                                <option value="Galxe">Galxe</option>
                                <option value="Zealy">Zealy</option>
                                <option value="Other">Lainnya</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-white/60 text-sm mb-2">Status</label>
                            <select id="project-status" class="w-full bg-white/5 border border-white/10 focus:border-cyan-400 rounded-3xl px-6 py-5 text-lg outline-none">
                                <option value="Ongoing">Ongoing</option>
                                <option value="Claimed">Claimed</option>
                                <option value="Ended">Ended</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="border-t border-white/10 px-8 py-6 flex gap-4">
                <button onclick="hideModal()" 
                        class="flex-1 py-6 rounded-3xl border border-white/10 hover:bg-white/5 text-lg font-medium transition">
                    Batal
                </button>
                <button onclick="saveAirdrop()" 
                        class="flex-1 py-6 neon-button text-black rounded-3xl text-lg font-semibold">
                    SIMPAN PROJECT
                </button>
            </div>
        </div>
    </div>

    <!-- Task Modal -->
    <div id="task-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl flex items-center justify-center z-50">
        <div class="modal bg-zinc-900 w-full max-w-xl mx-4 rounded-3xl border border-white/10 shadow-2xl">
            <div class="px-8 pt-8">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 id="task-modal-title" class="text-3xl font-semibold title-font"></h2>
                        <p id="task-modal-info" class="text-cyan-400"></p>
                    </div>
                    <button onclick="hideTaskModal()" class="text-4xl text-white/30 hover:text-white">×</button>
                </div>

                <div id="task-list" class="mt-8 space-y-3 max-h-[420px] overflow-auto pr-2">
                    <!-- Tasks generated by JS -->
                </div>

                <div class="mt-8 flex gap-3">
                    <input id="new-task-input" type="text" 
                           class="flex-1 bg-white/5 border border-white/10 rounded-3xl px-7 py-5 text-lg focus:border-cyan-400 outline-none"
                           placeholder="Tambah tugas baru (contoh: Follow Twitter, Join Discord)">
                    <button onclick="addTask()" 
                            class="neon-button text-black px-8 rounded-3xl text-2xl">+</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let airdrops = JSON.parse(localStorage.getItem('xenon_airdrops')) || [];

        function saveToLocal() {
            localStorage.setItem('xenon_airdrops', JSON.stringify(airdrops));
        }

        function getPlatformEmoji(platform) {
            const map = {
                'Twitter': '𝕏',
                'Discord': '💬',
                'Galxe': '🌌',
                'Zealy': '🏆',
                'Multi': '🔗'
            };
            return map[platform] || '🚀';
        }

        function renderAirdrops(filtered = airdrops) {
            const container = document.getElementById('airdrop-list');
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-24 border border-dashed border-white/10 rounded-3xl">
                        <div class="text-7xl mb-6 opacity-30">🚀</div>
                        <h3 class="text-2xl font-medium">Belum ada project</h3>
                        <p class="text-white/60 mt-2">Klik tombol di atas untuk menambahkan airdrop pertama kamu</p>
                    </div>`;
                updateStats();
                return;
            }

            filtered.forEach((airdrop, index) => {
                const total = airdrop.tasks ? airdrop.tasks.length : 0;
                const done = airdrop.tasks ? airdrop.tasks.filter(t => t.done).length : 0;
                const progress = total === 0 ? 0 : Math.round((done / total) * 100);

                const cardHTML = `
                <div onclick="openTaskModal(${index}); event.stopImmediatePropagation();" 
                     class="card bg-gradient-to-br from-zinc-900 to-black rounded-3xl p-8 cursor-pointer group">
                    <div class="flex justify-between">
                        <div class="flex items-center gap-4">
                            <span class="text-4xl transition-transform group-hover:scale-110">${getPlatformEmoji(airdrop.platform)}</span>
                            <div>
                                <h3 class="text-2xl font-semibold">${airdrop.name}</h3>
                                \( {airdrop.link ? `<a href=" \){airdrop.link}" target="_blank" onclick="event.stopImmediatePropagation()" class="text-cyan-400 text-sm hover:underline flex items-center gap-1 mt-1">
                                    <i class="fas fa-external-link-alt"></i> ${airdrop.link.replace('https://', '')}
                                </a>` : ''}
                            </div>
                        </div>
                        
                        <div>
                            <span class="px-5 py-2 text-xs font-medium rounded-3xl border ${airdrop.status === 'Claimed' ? 'border-emerald-400 text-emerald-400' : airdrop.status === 'Ended' ? 'border-red-400 text-red-400' : 'border-amber-400 text-amber-400'}">
                                ${airdrop.status}
                            </span>
                        </div>
                    </div>

                    <div class="mt-10 flex items-center gap-4">
                        <div class="flex-1 h-3 bg-white/10 rounded-3xl overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-cyan-400 to-purple-500 transition-all" style="width: ${progress}%"></div>
                        </div>
                        <div class="text-right">
                            <span class="text-4xl font-semibold text-cyan-400">${progress}</span><span class="text-white/40 text-2xl">%</span>
                        </div>
                        <div class="text-sm text-white/60">
                            \( {done}/ \){total}<br>
                            <span class="text-xs">tugas</span>
                        </div>
                    </div>
                </div>`;

                container.innerHTML += cardHTML;
            });

            updateStats();
        }

        function updateStats() {
            const total = airdrops.length;
            const claimed = airdrops.filter(a => a.status === 'Claimed').length;
            
            let totalTasks = 0, completed = 0;
            airdrops.forEach(a => {
                if (a.tasks) {
                    totalTasks += a.tasks.length;
                    completed += a.tasks.filter(t => t.done).length;
                }
            });

            document.getElementById('total-airdrop').textContent = total;
            document.getElementById('completed-airdrop').textContent = claimed;
            document.getElementById('total-tasks').textContent = totalTasks;
            document.getElementById('overall-progress').innerHTML = totalTasks === 0 ? '0%' : Math.round((completed / totalTasks) * 100) + '%';
        }

        function showAddModal() {
            document.getElementById('modal-title').innerHTML = 'Tambah Project Baru <span class="text-cyan-400 text-2xl">🚀</span>';
            document.getElementById('project-name').value = '';
            document.getElementById('project-link').value = '';
            document.getElementById('project-platform').value = 'Multi';
            document.getElementById('project-status').value = 'Ongoing';
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('project-name').focus();
        }

        function hideModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function saveAirdrop() {
            const name = document.getElementById('project-name').value.trim();
            if (!name) return alert("Nama project wajib diisi!");

            const newAirdrop = {
                name: name,
                link: document.getElementById('project-link').value.trim(),
                platform: document.getElementById('project-platform').value,
                status: document.getElementById('project-status').value,
                tasks: []
            };

            airdrops.unshift(newAirdrop); // tambah di paling atas
            saveToLocal();
            renderAirdrops();
            hideModal();
        }

        let currentIndex = null;

        function openTaskModal(index) {
            currentIndex = index;
            const a = airdrops[index];
            
            document.getElementById('task-modal-title').innerHTML = a.name;
            document.getElementById('task-modal-info').innerHTML = `${getPlatformEmoji(a.platform)} \( {a.platform} • <span class="font-medium"> \){a.status}</span>`;
            
            renderTasks();
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function hideTaskModal() {
            document.getElementById('task-modal').classList.add('hidden');
            renderAirdrops();
        }

        function renderTasks() {
            const container = document.getElementById('task-list');
            container.innerHTML = '';

            const a = airdrops[currentIndex];
            if (!a.tasks || a.tasks.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-white/40">Belum ada tugas. Tambahkan di bawah ini.</div>`;
                return;
            }

            a.tasks.forEach((task, i) => {
                const el = document.createElement('div');
                el.className = `flex items-center gap-4 bg-white/5 hover:bg-white/10 rounded-3xl px-6 py-5 group ${task.done ? 'task-done' : ''}`;
                el.innerHTML = `
                    <input type="checkbox" \( {task.done ? 'checked' : ''} onchange="toggleTask( \){i});" class="w-6 h-6 accent-cyan-400">
                    <span class="flex-1 text-lg">${task.text}</span>
                    <button onclick="deleteTask(${i}); event.stopImmedia
