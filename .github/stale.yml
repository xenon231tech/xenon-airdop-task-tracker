# Menutup otomatis issue dan PR yang sudah lama tidak aktif

name: 'Close stale issues and PRs'
on:
  schedule:
    - cron: '30 1 * * *'  # Setiap hari jam 01:30 UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v5
        with:
          # Untuk Issue
          stale-issue-message: '⏰ Issue ini sudah 30 hari tidak ada aktivitas. Akan ditutup dalam 7 hari.'
          close-issue-message: '❌ Issue ditutup karena tidak ada aktivitas.'
          days-before-issue-stale: 30
          days-before-issue-close: 7
          
          # Untuk Pull Request
          stale-pr-message: '⏰ PR ini sudah 30 hari tidak ada aktivitas. Akan ditutup dalam 7 hari.'
          close-pr-message: '❌ PR ditutup karena tidak ada aktivitas.'
          days-before-pr-stale: 30
          days-before-pr-close: 7
          
          # Label untuk issue/PR yang stale
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
